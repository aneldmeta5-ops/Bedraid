<style>
/* Layout: full-bleed 3D view. Top: hotbar, resources, health. Left: team status and floating walk stick. Right: jump, hit, place, shop. Menus are bottom sheets. */
:root{
  --ic-gold:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAABGUlEQVR4nGNgGDJgU4rg/00pgv/RxVkIaYKxPYosIWIMx//7zXnPCBNnxKfJe6IfVoO35m9igBnCiM0mZnlRfA5j+PvwNUN10A6G7hv/GBk3pQj+9515nuHfj3q8mmCAiaORgYGBgeHfj3qGCuPFkDD4fTOLgVV9Gk5DYJpgGu8v3MIg52DOwMCAFIj/ftQzMHE0wg1B1/RmzzaGz0//YRiOEgu/b2YxsGpuZWD49xCnJl5pJgZBVVNUA97fPs0gIu8Fse1bAkGN1UE7GBgYGBi6b/xjZPGb855xE4Pgf3OGbSgmI2tkYGBg6Cl/y8DAgNAIk4czNqUI/jf3ZWEQVDVleH/7NJImBgxNyABFEJYeDh/5iFfT4AIA37N31v1B0l4AAAAASUVORK5CYII=);--ic-em:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAwAAAAMCAYAAABWdVznAAAA50lEQVR4nIWRvWrCYBSGnwRvwCnFzVHI1EHvQxdXHUToHXRwKF3cK7h1rj/gHbgrBMG0BS1tyVD4TMHFwSWeDtV8+aLBdzrn8P7BsUijhhj7GCu55tLk1SiktesD8K4+UTxLUmTH5CqyHoa8HgIsAUtAeXOcbhNcnWqfnNejEF+Cs4bKm+FMtCiu5EtA+6sHQL94B8CUF9hEKG8WG9hkYLn//h9+tsY9U5CFi4LY/Qjntnw9YRq9weIXCnnjrp9SRai7sIl070Keh8YjnUoNfPOBWjRwhaeScH8jzkdTkj8wE05IEdLOfyXDUq6OOWmqAAAAAElFTkSuQmCC);--ic-dia:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA0AAAANCAYAAABy6+R8AAABFUlEQVR4nGNkQAe+Dv9R+JsPMGKoQdeADjAMYWBgYEHRsGk/w+Y3n+FCejwcDAxFqQwMDAz/kW1kQtbw8MdvhBkivAy2n/YwyGoJYjiICcZ4//49w6UvPxh8RXgZ9Hg4GB7++M1wmM8FIlmUiuZXX4f/7969+7/p9af//////9+Chhk6q/+n/L+F4jcmBgYGBkFBiBOQnYcBkGyDO0+Ph4NBYX4fVvVzqiYyMOw6BufDQ8/20x4G2WA9hpquGlQdZloMDAwMDA088gwNVyByjDB/yc4pY3g8YSsDg5sVqqZdxyBifbPhEQ13XpeYKU7vNPDIo/ARScTX4X9DXQtDw5eHGBoammpQkhNqusKSZBgYGDDSHwDs/4B1fBKZzgAAAABJRU5ErkJggg==);
  --bg:#0e1620;
  --panel:rgba(12,18,26,.68);
  --panel-solid:#162230;
  --line:rgba(255,255,255,.28);
  --ink:#f3f6f8;
  --muted:#a9b6c2;
  --accent:#ffb43c;
  --accent-ink:#1b1305;
  --bad:#ff5a4f;
  --good:#4cd27a;
  --display:'Silkscreen',ui-monospace,Menlo,monospace;
  --body:'Work Sans',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.4 var(--body);overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;padding:0;background:none;touch-action:none}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}

#cross{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;pointer-events:none;mix-blend-mode:difference}
#cross::before,#cross::after{content:"";position:absolute;background:#fff}
#cross::before{left:9px;top:2px;width:2px;height:16px}
#cross::after{left:2px;top:9px;width:16px;height:2px}
#crack{position:absolute;left:50%;top:calc(50% + 22px);width:56px;height:6px;margin-left:-28px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.6);opacity:0;transition:opacity .15s;pointer-events:none}
#crack.on{opacity:1}
#crack i{display:block;height:100%;width:100%;background:var(--accent)}
#hurt{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(255,40,30,0) 40%,rgba(255,40,30,.55) 100%)}
#hurt.on{animation:hurt .45s ease-out}
@keyframes hurt{0%{opacity:1}100%{opacity:0}}

#top{position:absolute;left:0;right:0;top:10px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.r1{display:flex;align-items:center;gap:8px}
#hotbar{display:flex;gap:4px;padding:4px;background:var(--panel);border:2px solid var(--line);border-radius:6px;pointer-events:auto;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.slot{position:relative;width:42px;height:42px;display:grid;place-items:center;border:2px solid transparent;border-radius:3px;background:rgba(255,255,255,.07)}
.slot canvas{width:28px;height:28px;image-rendering:pixelated;image-rendering:crisp-edges}
.slot b{position:absolute;right:2px;bottom:0;font:700 11px var(--display);text-shadow:1px 1px 0 #000}
.slot.on{border-color:var(--accent);background:rgba(255,180,60,.2)}
.slot.empty canvas{opacity:.3}
#menuBtn{width:42px;height:42px;border-radius:6px;background:var(--panel);border:2px solid var(--line);font:700 14px var(--display);pointer-events:auto}
#res{position:absolute;left:10px;top:0;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.chip i.ico{width:16px;height:16px;border:0;background-size:contain;background-repeat:no-repeat;background-position:center;image-rendering:pixelated}
.ico.ig{background-image:var(--ic-gold)}.ico.ie{background-image:var(--ic-em)}.ico.id{background-image:var(--ic-dia)}
.chip{display:flex;align-items:center;gap:5px;padding:3px 8px 3px 5px;background:var(--panel);border:2px solid var(--line);border-radius:4px;font:700 12px var(--display)}
.chip i{width:12px;height:12px;border:2px solid rgba(0,0,0,.45);box-sizing:border-box}
#hp{position:relative;width:min(240px,62vw);height:16px;background:rgba(0,0,0,.55);border:2px solid var(--line);border-radius:3px;overflow:hidden}
#hp i{position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--bad)}
#hp b{position:absolute;inset:0;display:grid;place-items:center;font:700 10px var(--display);text-shadow:1px 1px 0 #000}

#teams{position:absolute;left:10px;top:70px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.tc{width:34px;height:26px;display:grid;place-items:center;border:2px solid rgba(0,0,0,.5);border-radius:3px;font:700 11px var(--display);color:#fff;text-shadow:1px 1px 0 rgba(0,0,0,.6)}
.tc.me{outline:2px solid #fff;outline-offset:1px}
.tc.out{opacity:.3;text-decoration:line-through}
#feed{position:absolute;right:10px;top:70px;max-width:58%;display:flex;flex-direction:column;align-items:flex-end;gap:3px;pointer-events:none;font:600 12px/1.25 var(--body);text-shadow:0 1px 2px #000,0 0 3px #000}
#feed div{background:rgba(0,0,0,.38);padding:2px 6px;border-radius:3px;animation:fin .2s ease-out}
@keyframes fin{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}

#stick{position:absolute;width:116px;height:116px;border-radius:50%;border:2px solid var(--line);background:var(--panel);pointer-events:none;opacity:.8}
#stick.live{opacity:1;border-color:#fff}
#knob{position:absolute;left:34px;top:34px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.82);border:2px solid #fff}
.pad{position:absolute;display:grid;place-items:center;border-radius:50%;background:var(--panel);border:2px solid var(--line);font:700 11px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.pad.held{background:rgba(255,180,60,.38);border-color:var(--accent)}
#jumpBtn{right:18px;bottom:26px;width:78px;height:78px}
#hitBtn{right:108px;bottom:34px;width:66px;height:66px;background:rgba(255,90,79,.35);border-color:var(--bad)}
#placeBtn{right:24px;bottom:114px;width:58px;height:58px}
#shopBtn{right:30px;bottom:180px;width:52px;height:52px;background:rgba(255,180,60,.3);border-color:var(--accent)}

#banner{position:absolute;left:0;right:0;top:26%;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;opacity:0;transition:opacity .25s;text-align:center;padding:0 20px}
#banner.on{opacity:1}
#banner b{font:700 26px/1.1 var(--display);letter-spacing:.04em;text-transform:uppercase;text-shadow:3px 3px 0 rgba(0,0,0,.6);text-wrap:balance}
#banner span{font:600 14px var(--body);text-shadow:0 1px 3px #000}
#banner.bad b{color:var(--bad)}
#banner.good b{color:var(--good)}
#banner.info b{color:var(--accent)}
#toast{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);padding:6px 12px;border-radius:4px;background:var(--panel);border:2px solid var(--line);font:700 11px var(--display);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.show{opacity:1}

.overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;z-index:5}
.overlay[hidden]{display:none}
#menu{background:linear-gradient(to top,rgba(8,12,18,.94) 0%,rgba(8,12,18,.6) 60%,rgba(8,12,18,.08) 100%)}
#shop{background:rgba(8,12,18,.55)}
.sheet{padding:20px 18px 24px;display:flex;flex-direction:column;gap:14px;max-width:560px;width:100%;box-sizing:border-box;max-height:100%;overflow-y:auto;touch-action:pan-y}
.sheet h1{margin:0;font:700 36px/1 var(--display);letter-spacing:.02em;color:var(--accent);text-shadow:3px 3px 0 rgba(0,0,0,.5);text-wrap:balance}
.sheet p{margin:0;color:var(--muted)}
.lbl{font:700 11px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.maps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mapb{min-height:62px;padding:8px 6px;border-radius:6px;background:var(--panel-solid);border:2px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:3px;touch-action:manipulation}
.mapb b{font:700 12px/1.1 var(--display);text-transform:uppercase}
.mapb span{font-size:11px;color:var(--muted);line-height:1.2}
.mapb.on{border-color:var(--accent);background:rgba(255,180,60,.16)}
.swatches{display:flex;gap:10px}
.sw{width:52px;height:44px;border-radius:6px;border:3px solid rgba(0,0,0,.4);touch-action:manipulation}
.sw.on{outline:3px solid #fff;outline-offset:2px}
.tips{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.tips li{display:grid;grid-template-columns:88px 1fr;gap:10px;align-items:baseline;min-width:0}
.tips b{font:700 10px var(--display);letter-spacing:.08em;text-transform:uppercase}
.tips span{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px}
.cta{flex:1;min-height:52px;border-radius:6px;font:700 14px var(--display);letter-spacing:.08em;text-transform:uppercase;touch-action:manipulation}
.cta.main{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 #b57a14}
.cta.main:active{transform:translateY(3px);box-shadow:0 1px 0 #b57a14}
.cta.alt{flex:0 0 38%;background:var(--panel-solid);border:2px solid var(--line)}
.cta:focus-visible,.mapb:focus-visible,.sw:focus-visible,.buy:focus-visible{outline:3px solid #fff;outline-offset:2px}

#shop .sheet{background:var(--panel-solid);border-top:3px solid var(--accent);border-radius:12px 12px 0 0;max-height:78%;gap:10px;padding-top:14px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.shead h2{margin:0;font:700 18px var(--display);color:var(--accent);text-transform:uppercase}
#shopClose{width:44px;height:36px;border-radius:5px;background:rgba(255,255,255,.08);border:2px solid var(--line);font:700 13px var(--display);touch-action:manipulation}
#shopRes{display:flex;gap:6px;flex-wrap:wrap}
.cat{margin:6px 0 0;font:700 10px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.item{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:6px;background:rgba(255,255,255,.05);border-radius:6px;min-width:0}
.item canvas{width:36px;height:36px;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:3px}
.item .nm{font-weight:600;font-size:14px}
.item .ds{font-size:12px;color:var(--muted)}
.buy{min-width:74px;min-height:40px;padding:0 8px;border-radius:5px;background:var(--accent);color:var(--accent-ink);font:700 12px var(--display);display:flex;align-items:center;justify-content:center;gap:5px;touch-action:manipulation}
.buy i{width:11px;height:11px;border:2px solid rgba(0,0,0,.5);box-sizing:border-box}
.buy.no{background:rgba(255,255,255,.1);color:var(--muted)}
.buy.no i{opacity:.5}
/* v2: bottom hotbar, lobby, settings, battle sky */
#hotbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(6px + env(safe-area-inset-bottom,0px));z-index:2;display:flex;gap:3px;padding:3px;background:rgba(20,16,14,.78);border:3px solid #1b1512;outline:2px solid rgba(255,255,255,.25);border-radius:3px;pointer-events:auto}
.slot{width:40px;height:40px;border-radius:2px;background:rgba(120,110,100,.38);border:3px solid rgba(0,0,0,.45)}
.slot.on{border-color:#fff;background:rgba(255,255,255,.25)}
.slot.gear{background:rgba(255,180,60,.14)}
.slot.gear b{left:2px;right:auto;font-size:9px}
.slot canvas{width:30px;height:30px}
#menuBtn{position:absolute;right:10px;top:0}
#viewBtn{right:10px;top:62px;width:44px;height:44px;font-size:9px;transform-origin:100% 0}
#feed{top:118px}
.pad{transform:scale(var(--cs,1));transform-origin:100% 100%}
#bridgeBtn{right:92px;bottom:190px;width:58px;height:58px;background:rgba(76,141,255,.3);border-color:#4c8dff}#jumpBtn{bottom:92px}#hitBtn{bottom:100px}#placeBtn{bottom:180px}#shopBtn{bottom:246px}
#toast{bottom:230px;z-index:6}
#hp{width:auto;height:auto;background:none;border:0;overflow:visible;display:flex;gap:1px;filter:drop-shadow(1px 1px 0 #000)}
.ht{font:18px/1 sans-serif;color:#3a1010}.ht.f{color:#ff3b30}
.ht.h{background:linear-gradient(90deg,#ff3b30 50%,#3a1010 50%);-webkit-background-clip:text;background-clip:text;color:transparent}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:1}
#dlg{position:absolute;right:10px;top:58px;bottom:70px;width:min(340px,50%);z-index:30;background:var(--panel-solid);border:2px solid var(--accent);border-radius:8px;padding:10px;overflow-y:auto;touch-action:pan-y;pointer-events:auto;box-sizing:border-box}#dlg .dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font:700 14px var(--display)}#dlg .mapb.on{border-color:var(--accent)}
#ltabs{display:none!important}#lbar{position:absolute;left:0;right:0;bottom:0;height:54px;display:flex;align-items:center;gap:8px;padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px));background:rgba(10,14,20,.9);border-top:2px solid var(--line);pointer-events:auto;box-sizing:content-box;overflow:hidden}#lbar .sl{min-width:62px;padding:3px 6px;border:2px solid var(--line);border-radius:4px;background:var(--panel);font:700 9px/1.2 var(--display);text-align:center;text-transform:uppercase}#lbar .sl i{display:block;font-style:normal;color:var(--accent);font-size:8px}#lhp{font-size:15px;color:#ff4a4a;letter-spacing:-1px;white-space:nowrap}#lar{display:flex;align-items:center;gap:3px;font:700 13px var(--display)}
#rot{position:fixed;inset:0;z-index:99;background:#0e1620;color:#fff;display:none;align-items:center;justify-content:center;font:700 18px var(--display);text-align:center;padding:30px}
@media (orientation:portrait){#rot{display:flex}}
body[data-mode=lobby] :is(#top,#teams,#feed,#shopBtn,#placeBtn,#hitBtn,#viewBtn,#bridgeBtn,#throwBtn,#bagBtn,#cross,#crack,#hotbar,#banner,#hurt){display:none!important}
#lobby{position:absolute;inset:0;z-index:4;pointer-events:none}
#lobby[hidden]{display:none}
#ltop{position:absolute;left:0;right:0;top:10px;padding:0 10px;display:flex;align-items:center;gap:8px}
#ltop h1{margin:0;flex:1;font:700 20px var(--display);color:var(--accent);text-shadow:2px 2px 0 rgba(0,0,0,.6)}
#ltop>*{pointer-events:auto}
#ltop h1{pointer-events:none}
.mini{min-width:44px;height:36px;padding:0 10px;border-radius:5px;background:var(--panel);border:2px solid var(--line);font:700 11px var(--display);text-transform:uppercase;touch-action:manipulation}
#ltabs{position:absolute;left:0;right:0;bottom:0;display:flex;gap:5px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(10,14,20,.88);pointer-events:auto}
#ltabs button{flex:1;min-height:46px;border-radius:5px;background:var(--panel-solid);border:2px solid var(--line);font:700 10px var(--display);text-transform:uppercase;touch-action:manipulation}
#ltabs button.on{border-color:var(--accent);background:rgba(255,180,60,.2)}
#ltabs button.go{background:var(--accent);color:var(--accent-ink);border-color:#b57a14}
#lpanel{position:absolute;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));max-height:48%;overflow-y:auto;padding:10px;background:rgba(14,20,28,.94);border-top:3px solid var(--accent);pointer-events:auto;touch-action:pan-y;box-sizing:border-box}
#lpanel[hidden]{display:none}
.lph{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.lph b{font:700 13px var(--display);text-transform:uppercase;color:var(--accent)}
#lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border-radius:6px;background:rgba(255,255,255,.06);border:2px solid transparent;touch-action:manipulation;min-width:0}
.card.on{border-color:var(--accent);background:rgba(255,180,60,.16)}
.card canvas{width:56px;height:56px;image-rendering:pixelated;image-rendering:crisp-edges}
.cn{font:600 11px/1.1 var(--body);text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp{font:700 10px var(--display);color:var(--muted);display:flex;align-items:center;gap:4px}
.cp i{width:12px;height:12px;background:var(--ic-dia) center/contain no-repeat;image-rendering:pixelated}
.card.on .cp{color:var(--good)}

/* wardrobe */
body[data-wd] #ltop,body[data-wd] #lbar,body[data-wd] #stick,body[data-wd] #jumpBtn{display:none!important}
#wd{position:absolute;inset:0;z-index:6;pointer-events:none}
#wd[hidden]{display:none}
#wd>*{pointer-events:auto}
#wspot{position:absolute;inset:0;pointer-events:none!important;background:radial-gradient(ellipse 26% 75% at 38% 60%,rgba(255,236,190,.26),rgba(0,0,0,0) 72%),linear-gradient(90deg,rgba(0,0,0,.3),rgba(0,0,0,0) 40%,rgba(0,0,0,.2))}
#wside{position:absolute;left:0;top:0;bottom:0;width:clamp(130px,19vw,190px);background:linear-gradient(180deg,#22389a,#0a1240);border-right:3px solid #070b26;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);overflow-y:auto}
#wside h2{margin:10px 8px 8px;font:italic 800 22px var(--display);color:#c9d6ff;text-shadow:2px 2px 0 rgba(0,0,0,.55)}
.wcat{min-height:48px;padding:0 6px;font:italic 800 14px var(--display);color:#fff;background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.12);text-shadow:1px 1px 0 rgba(0,0,0,.6);touch-action:manipulation}
.wcat.on{background:linear-gradient(90deg,#eef2ff,#a7b7ee);color:#10205f;text-shadow:none}

          stepEnt(e, dt, dx / d * 2.8, dz / d * 2.8, e.bx || e.bz);
          if (e.bx || e.bz) A.stuck += dt; else A.stuck = 0;
        }
      }
      if (e.y < TOP - 4) { e.x = 48.5; e.z = 56.5; e.y = TOP + 1.2; e.vy = 0; pickWander(e); }
    }
    for (const e of lobbyEnts) animEnt(e, dt);
    const wdo2 = !$('wd').hidden;
    if (wdo2) { pitch = -0.1; const cy = LP.yaw + Math.PI + Math.sin(T * 0.7) * 0.5, cp = Math.cos(pitch); camera.position.set(LP.x + Math.sin(cy) * cp * 3.7, LP.y + 1.25 - Math.sin(pitch) * 3.7, LP.z + Math.cos(cy) * cp * 3.7); camera.rotation.set(pitch, cy, 0); }
    else { pitch = lobPitch; const cp = Math.cos(pitch); camera.position.set(LP.x + Math.sin(yaw) * cp * 5.5, LP.y + 1.5 - Math.sin(pitch) * 5.5, LP.z + Math.cos(yaw) * cp * 5.5); camera.rotation.set(pitch, yaw, 0); }
    const off = wdo2 ? 'w' : (!$('lpanel').hidden ? 'p' : '');
    if (off !== lastOff) {
      lastOff = off; const w = app.clientWidth, h = app.clientHeight;
      if (off === 'w') camera.setViewOffset(w, h, Math.round((Math.min(420, w * 0.44) - Math.min(190, Math.max(130, w * 0.19))) / 2), 0, w, h);
      else if (off === 'p') camera.setViewOffset(w, h, 0, Math.round(h * 0.2), w, h); else camera.clearViewOffset();
    }
  }

  /* ================= touch input ================= */
  const stickEl = $('stick'), knob = $('knob');
  const STICK = 116, MAXR = 50;
  let stickId = null, sox = 0, soy = 0;
  const touches = {};
  function defaultStick(){ stickEl.style.left = '22px'; stickEl.style.top = (app.clientHeight - STICK - 96) + 'px'; }
  function resetStick(){
    stickId = null; jx = jy = 0;
    stickEl.classList.remove('live'); knob.style.transform = 'translate(0,0)'; defaultStick();
  }
  function press(btn, id){
    if (btn.hasAttribute('data-pad')) { usePad(); return; }
    if (btn.hasAttribute('data-bag')) { if (!shopOpen) openInv(); return; }
    if (btn.hasAttribute('data-gear')) { if (btn.getAttribute('data-gk') === 'sword') { selSword = true; thSel = 0; hudCache = ''; } toast(btn.getAttribute('data-gear')); return; }
    if (btn.hasAttribute('data-th')) { thSel = parseInt(btn.getAttribute('data-th'), 10); hudCache = ''; return; }
    if (btn.hasAttribute('data-slot')) { selSlot = parseInt(btn.getAttribute('data-slot'), 10); thSel = 0; selSword = false; hudCache = ''; return; }
    const bid = btn.id;
    if (bid === 'jumpBtn') { jumpHeld = true; btn.classList.add('held'); touches[id] = { kind: 'hold', el: btn, name: 'jump' }; }
    else if (bid === 'hitBtn') { hitHeld = true; btn.classList.add('held'); touches[id] = { kind: 'hold', el: btn, name: 'hit' }; }
    else if (bid === 'placeBtn') { placeHeld = true; btn.classList.add('held'); touches[id] = { kind: 'hold', el: btn, name: 'place' }; }
    else if (bid === 'bridgeBtn') { bridgeHeld = true; btn.classList.add('held'); touches[id] = { kind: 'hold', el: btn, name: 'bridge' }; }
    else if (bid === 'shopBtn') openShop();
    else if (bid === 'menuBtn') showMenu('pause');
    else if (bid === 'throwBtn') { thSel = (thSel + 1) % 3; btn.textContent = ['Block', 'Fire', 'TNT'][thSel]; }
    else if (bid === 'viewBtn') { tp = !tp; toast(tp ? 'Third person' : 'First person'); }
  }
  function tapRay(cx, cy){
    const r = app.getBoundingClientRect();
    const v = new THREE.Vector3(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1, 0.5);
    camera.updateMatrixWorld(true);
    v.unproject(camera).sub(camera.position).normalize();
    return v;
  }
  const centerDir = new THREE.Vector3();
  function centerRay(){ camera.getWorldDirection(centerDir); return centerDir; }
  const eyeV = new THREE.Vector3();
  function eye(){ return eyeV.set(P.x, P.y + 1.62, P.z); }

  app.addEventListener('touchstart', function(e){
    const lob = state === 'lobby';
    if (lob && e.target.closest && e.target.closest('#ltop,#ltabs,#lbar,#lpanel,#dlg,#wd,#load,.overlay')) return;
    if ((state !== 'play' && !lob) || shopOpen || (!lob && !P.alive)) return;
    e.preventDefault();
    const r = app.getBoundingClientRect();
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      const btn = t.target && t.target.closest ? t.target.closest('[data-btn]') : null;
      if (btn) { press(btn, t.identifier); continue; }
      const x = t.clientX - r.left, y = t.clientY - r.top;
      if (stickId === null && x < r.width * 0.5 && y > r.height * 0.35) {
        stickId = t.identifier; sox = x; soy = y;
        stickEl.style.left = (x - STICK / 2) + 'px'; stickEl.style.top = (y - STICK / 2) + 'px';
        stickEl.classList.add('live');
        touches[t.identifier] = { kind: 'stick' };
      } else {
        const rec = { kind: 'look', lx: t.clientX, ly: t.clientY, sx: t.clientX, sy: t.clientY, t0: performance.now(), moved: false, done: false, timer: 0 };
        rec.timer = setTimeout(function(){ if (!rec.moved && !rec.done && state === 'play') { rec.done = true; placePlayer(eye(), tapRay(rec.sx, rec.sy)); } }, 420);
        touches[t.identifier] = rec;
      }
    }
  }, { passive: false });
  app.addEventListener('touchmove', function(e){
    if (state === 'lobby' && !Object.keys(touches).length) return;
    if ((state !== 'play' && state !== 'lobby') || shopOpen) return;
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i], rec = touches[t.identifier];
      if (!rec) continue;
      if (rec.kind === 'stick') {
        const r = app.getBoundingClientRect();
        let dx = (t.clientX - r.left) - sox, dy = (t.clientY - r.top) - soy;
        let len = Math.hypot(dx, dy);
        if (len > MAXR) { dx = dx / len * MAXR; dy = dy / len * MAXR; len = MAXR; }
        knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
        if (len / MAXR < 0.12) { jx = 0; jy = 0; } else { jx = dx / MAXR; jy = dy / MAXR; }
      } else if (rec.kind === 'look') {
        if (!rec.moved) {
          if (Math.hypot(t.clientX - rec.sx, t.clientY - rec.sy) > 10) { rec.moved = true; rec.lx = t.clientX; rec.ly = t.clientY; clearTimeout(rec.timer); }
          else continue;
        }
        yaw -= (t.clientX - rec.lx) * 0.0058 * S.sens;
        { const dp = (t.clientY - rec.ly) * 0.0058 * S.sens * (S.inv ? -1 : 1); if (state === 'lobby') lobPitch = Math.max(-1.2, Math.min(0.2, lobPitch - dp)); else pitch -= dp; }
        pitch = Math.max(-1.5, Math.min(1.5, pitch));
        rec.lx = t.clientX; rec.ly = t.clientY;
      }
    }
  }, { passive: false });
  function endTouch(e, cancelled){
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i], rec = touches[t.identifier];
      if (!rec) continue;
      delete touches[t.identifier];
      if (rec.kind === 'stick') resetStick();
      else if (rec.kind === 'hold') {
        rec.el.classList.remove('held');
        if (rec.name === 'jump') jumpHeld = false; else if (rec.name === 'hit') hitHeld = false; else if (rec.name === 'bridge') bridgeHeld = false; else placeHeld = false;
      } else if (rec.kind === 'look') {
        clearTimeout(rec.timer);
        if (!cancelled && state === 'play' && !shopOpen && P.alive && !rec.moved && !rec.done && performance.now() - rec.t0 < 400) strikePlayer(eye(), tapRay(rec.sx, rec.sy), true);
      }
    }
  }
  app.addEventListener('touchend', function(e){ if (state === 'play' && !shopOpen) e.preventDefault(); endTouch(e, false); }, { passive: false });
  app.addEventListener('touchcancel', function(e){ endTouch(e, true); }, { passive: false });
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());

  /* ================= sizing ================= */
  function resize(){
    const w = app.clientWidth, h = app.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    baseFov = w / h < 1 ? S.fov + 10 : S.fov - 2; camera.fov = baseFov; lastOff = null;
    camera.updateProjectionMatrix();
    if (stickId === null) defaultStick();
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(app);
  window.addEventListener('resize', resize);
  document.addEventListener('touchend', function(){ try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); screen.orientation.lock('landscape'); } catch (e) {} }, { once: true });
  window.addEventListener('orientationchange', () => setTimeout(resize, 250));

  /* ================= main update ================= */
  function updateGens(dt){
    for (const g of gens) {
      for (const it of g.items) {
        it.acc += dt;
        if (it.acc >= it.period) { it.acc -= it.period; if (it.stock < it.cap) it.stock++; }
        it.mesh.visible = it.stock > 0;
        if (it.stock > 0) {
          it.mesh.rotation.y += dt * 2.4; it.mesh.rotation.x = 0.4;
          const sc = Math.min(1.6, 0.7 + it.stock * 0.04);
          it.mesh.scale.set(sc, sc, sc);
          it.mesh.position.y = TOP + 1.8 + Math.sin(T * 2 + g.x) * 0.16;
        }
      }
      for (const e of ents) {
        if (e.shop || !e.alive) continue;
        if (Math.abs(e.x - g.x) < 2.4 && Math.abs(e.z - g.z) < 2.4 && Math.abs(e.y - g.y) < 3.2) {
          let got = 0;
          for (const it of g.items) if (it.stock > 0) { e.res[it.res] += it.stock; got += it.stock; it.stock = 0; }
          if (got && e.isPlayer) sfx(760, 0.09, 'sine', 0.06);
        }
      }
    }
  }
  function update(dt){
    T += dt;
    if (P.alive) {
      const fx = -Math.sin(yaw), fz = -Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
      const wx = (fx * (-jy) + rx * jx) * (bridgeHeld ? 7.4 : 5.6), wz = (fz * (-jy) + rz * jx) * (bridgeHeld ? 7.4 : 5.6);
      const wx2 = wx, wz2 = wz;
      stepEnt(P, dt, wx2, wz2, jumpHeld);
      if ((P.bx || P.bz) && P.onGround && Math.hypot(jx, jy) > 0.3) {
        const l = Math.hypot(wx, wz) || 1;
        if (!hits(P.x + wx / l * 0.55, P.y + 1.05, P.z + wz / l * 0.55)) { P.vy = 7.8; P.onGround = false; }
      }
      P.yaw = yaw;
      P.cd -= dt; stepProj(dt); stepPads(dt);
      if (hitHeld) { holdHit -= dt; if (holdHit <= 0) { if (thSel) { holdHit = 0.1; if (T >= (P.thNext || 0)) { P.thNext = T + 0.7; throwItem(eye(), centerRay()); P.swing = 1; } } else { selSword = true; holdHit = 0.14; strikePlayer(eye(), centerRay(), false); } } } else holdHit = 0;
      if (bridgeHeld) bridgePlayer();
      if (placeHeld) { holdPlace -= dt; if (holdPlace <= 0) { holdPlace = 0.03; placePlayer(eye(), centerRay()); } } else holdPlace = 0;
    }
    for (const e of ents) {
      if (e.shop) continue;
      if (e.alive) {
        e.inv_t = Math.max(0, e.inv_t - dt);
        if (!e.isPlayer) { e.cd -= dt; e.ai.t -= dt; if (e.ai.t <= 0) { e.ai.t = 0.2 + Math.random() * 0.1; botDecide(e); } botAct(e, dt); }
        if (T - e.lastHurt > 6 && e.hp < 20) { e.hp = Math.min(20, e.hp + dt * 0.8); if (e.tagC && Math.ceil(e.hp) !== e.tagHp) drawTag(e); }
        if (e.y < VOID_Y) die(e, e.lastAtt);
      } else if (!e.out && e.respawn > 0) {
        e.respawn -= dt;
        if (e.respawn <= 0) respawn(e);
      }
    }
    updateGens(dt); stepFx(dt);
    if (G.endT && T >= G.endT) { const res = G.result; G.endT = 0; showMenu(res); }
  }

  /* ================= boot + loop ================= */
  loadPrefs(); applySettings();
  enterLobby();
  resize(); defaultStick();
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}

  function playCam(dt){
    const sp = Math.hypot(P.vx, P.vz), spf = Math.min(1, sp / 4.5);
    if (P.alive) {
      if (P.onGround) bobT += dt * sp * 2.3;
      const ey = P.y + 1.62 + (P.onGround ? Math.sin(bobT) * 0.035 * spf : 0);
      if (!tp) camera.position.set(P.x, ey, P.z);
      else {
        const cp = Math.cos(pitch), bx = Math.sin(yaw) * cp, by = -Math.sin(pitch), bz = Math.cos(yaw) * cp;
        const r = raycast({ x: P.x, y: ey, z: P.z }, { x: bx, y: by, z: bz }, 3.8);
        const want = r ? Math.max(0.7, r.t - 0.35) : 3.8;
        tpD += (want - tpD) * Math.min(1, dt * 14);
        camera.position.set(P.x + bx * tpD, ey + by * tpD, P.z + bz * tpD);
      }
      camera.rotation.set(pitch, yaw, 0);
      P.group.visible = tp; vm.visible = !tp;
      const k = P.swing > 0 ? Math.sin(Math.PI * (1 - P.swing)) : 0;
      vm.rotation.x = -0.9 * k;
      vm.position.y = -0.3 - 0.06 * k + Math.sin(bobT * 2) * 0.008 * spf;
      vm.position.x = 0.3 + Math.cos(bobT) * 0.01 * spf;
    } else {
      camera.position.set(P.x, P.y + 4.5, P.z + 0.01);
      camera.rotation.set(-1.45, yaw, 0);
      vm.visible = false;
    }
    const want = baseFov + 4 * spf;
    if (Math.abs(camera.fov - want) > 0.05) { camera.fov += (want - camera.fov) * Math.min(1, dt * 8); camera.updateProjectionMatrix(); }
  }

  let last = performance.now();
  function frame(now){
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (state === 'play') {
      if (!shopOpen) { let rem = dt; while (rem > 1e-4 && state === 'play') { const s = Math.min(rem, 1 / 60); update(s); rem -= s; } }
      if (state === 'play') {
        playCam(dt);
        updateHud(); updateTeams(false);
        if (crackT > 0) { crackT -= dt; if (crackT <= 0) $('crack').classList.remove('on'); }
        for (const e of ents) animEnt(e, dt);
        nextBolt -= dt;
        if (nextBolt <= 0) { nextBolt = 6 + Math.random() * 9; }
      }
    } else if (state === 'lobby') {
      vm.visible = false;
      lobbyTick(dt);
    } else {
      vm.visible = false;
      orbit += dt * 0.12;
      camera.position.set(48 + Math.cos(orbit) * 64, 46, 48 + Math.sin(orbit) * 64);
      camera.lookAt(48, 16, 48);
      for (const e of ents) animEnt(e, dt);
    }
    if (flashT > 0) { flashT -= dt; $('flash').style.opacity = String(Math.max(0, flashT > 0.3 ? 0.55 : (flashT > 0.22 ? 0.05 : flashT * 1.1))); }
    for (const p of parts) {
      if (p.life <= 0) continue;
      p.life -= dt; p.vy -= p.g * dt;
      p.m.position.x += p.vx * dt; p.m.position.y += p.vy * dt; p.m.position.z += p.vz * dt;
      if (p.life <= 0) p.m.visible = false;
    }
    for (const p of gparts) {
      if (p.life <= 0) continue;
      p.life -= dt; p.vy -= p.g * dt;
      p.m.position.x += p.vx * dt; p.m.position.y += p.vy * dt; p.m.position.z += p.vz * dt;
      const k = Math.max(0, p.life / p.max); p.m.scale.setScalar(p.sz * (0.35 + 0.65 * k)); p.m.material.opacity = Math.min(1, k * 1.6);
      if (p.life <= 0) p.m.visible = false;
    }
    const kids = clouds.children;
    for (let i = 0; i < kids.length; i++) { kids[i].position.x += dt * 1.4; if (kids[i].position.x > 190) kids[i].position.x = -80; }
    skyM.position.copy(camera.position);
    if (embers.visible) {
      embers.position.copy(camera.position);
      for (let i = 0; i < EM; i++) {
        let y = emPos[i * 3 + 1] - dt * (2.2 + (i % 4) * 0.6); if (y < -8) y = 26;
        emPos[i * 3 + 1] = y; emPos[i * 3] += Math.sin(now * 0.001 + i) * dt * 0.8;
      }
      emG.attributes.position.needsUpdate = true;
    }
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

})();
</script>
